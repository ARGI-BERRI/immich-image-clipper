<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Immich Image Clipper - Options</title>
    </head>
    <body>
        <h1>Immich Image Clipper - Options</h1>
        <form action="">
            <label for="iic-server-url">Server URL:</label>
            <input type="text" name="iic-server-url" id="iic-server-url" />

            <label for="iic-api-key">API Key:</label>
            <input type="password" name="iic-api-key" id="iic-api-key" />

            <button type="submit">Save</button>
        </form>
    </body>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }
    </style>
</html>
