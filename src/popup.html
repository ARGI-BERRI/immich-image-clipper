<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Immich Image Clipper - Options</title>
        <link rel="stylesheet" href="./popup.css" />
    </head>
    <body>
        <h1>Immich Image Clipper - Options</h1>
        <form action="" method="post" class="options">
            <div>
                <label for="iic-server-url">Server URL:</label>
                <input type="text" name="iic-server-url" id="iic-server-url" />
            </div>

            <div>
                <label for="iic-api-key">API Key:</label>
                <input type="password" name="iic-api-key" id="iic-api-key" />
            </div>

            <button type="submit">Save</button>
        </form>
        <script src="./popup.js"></script>
    </body>
</html>
