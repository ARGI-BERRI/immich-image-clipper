<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Immich Image Clipper - Options</title>
        <link rel="stylesheet" href="./popup.css" />
    </head>
    <body>
        <h1>Immich Image Clipper - Options</h1>
        <form action="" method="post" class="options">
            <div>
                <label for="iic-server-url">Server URL:</label>
                <input
                    type="url"
                    name="iic-server-url"
                    id="iic-server-url"
                    required
                    placeholder="https://immich.example.com"
                />
            </div>

            <div>
                <label for="iic-api-key">API Key:</label>
                <input
                    type="password"
                    name="iic-api-key"
                    id="iic-api-key"
                    required
                    autocomplete="off"
                />
            </div>

            <button type="submit">Save</button>
            <p
                id="iic-status"
                class="status"
                role="status"
                aria-live="polite"
            ></p>
        </form>

        <section
            class="upload-history"
            aria-labelledby="iic-upload-history-title"
        >
            <h2 id="iic-upload-history-title">Recent Uploads</h2>
            <ul
                id="iic-uploaded-url-list"
                class="uploaded-url-list"
                aria-live="polite"
            ></ul>
            <p id="iic-uploaded-url-empty" class="empty-history">
                No uploads yet.
            </p>
        </section>
        <script src="./popup.js"></script>
    </body>
</html>
